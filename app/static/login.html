<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - NAS 流量监控</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-box">
      <h2>NAS 流量监控</h2>
      <p>请输入用户名和密码登录</p>
      <div id="error" class="alert-error" style="display:none"></div>
      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="username" placeholder="请输入用户名" autofocus>
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="password" placeholder="请输入密码">
      </div>
      <button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="doLogin()">登 录</button>
    </div>
  </div>
  <script src="/js/common.js"></script>
  <script>
    if (localStorage.getItem('token')) {
      window.location.href = '/';
    }

    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });

    async function doLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errDiv = document.getElementById('error');
      if (!username || !password) {
        errDiv.textContent = '请输入用户名和密码';
        errDiv.style.display = 'block';
        return;
      }
      try {
        const data = await api.post('/api/auth/login', { username, password });
        localStorage.setItem('token', data.token);
        window.location.href = '/';
      } catch (e) {
        errDiv.textContent = e.message || '登录失败';
        errDiv.style.display = 'block';
      }
    }
  </script>
</body>
</html>
