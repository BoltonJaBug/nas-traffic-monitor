<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>服务列表 - NAS 流量监控</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="header">
    <h1>NAS 流量监控</h1>
    <nav id="nav"></nav>
  </div>
  <div class="container">
    <div class="card">
      <div class="card-title">所有服务</div>
      <table id="service-table">
        <thead>
          <tr><th>服务名称</th><th>来源</th><th>状态</th><th>镜像</th><th>端口</th><th>操作</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
  <script src="/js/common.js"></script>
  <script>
    checkAuth();
    loadNav('services');

    async function loadServices() {
      try {
        const services = await api.get('/api/services');
        const tbody = document.querySelector('#service-table tbody');
        tbody.innerHTML = services.map(s => {
          let ports = '-';
          try { const p = JSON.parse(s.ports); if (p.length) ports = p.join(', '); } catch {}
          return `
            <tr>
              <td><a href="/service-detail.html?id=${s.service_id}">${s.name}</a></td>
              <td><span class="badge badge-blue">${s.source}</span></td>
              <td><span class="badge ${s.status === 'running' ? 'badge-green' : 'badge-gray'}">${s.status === 'running' ? '运行中' : '已停止'}</span></td>
              <td style="font-size:12px;color:#888">${s.image || '-'}</td>
              <td style="font-size:12px">${ports}</td>
              <td><a href="/service-detail.html?id=${s.service_id}">查看详情</a></td>
            </tr>
          `;
        }).join('');
      } catch (e) {
        console.error(e);
      }
    }

    loadServices();
  </script>
</body>
</html>
